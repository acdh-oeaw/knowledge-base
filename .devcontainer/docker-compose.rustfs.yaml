services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: dariah-knowledge-base-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${RUSTFS_WEB_UI_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rustfs-data:
    name: dariah-knowledge-base-rustfs-data

networks:
  default:
    name: dariah-knowledge-base
